<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A responsive editorial card explaining the principles behind soccer's modern high press.">
  <meta name="color-scheme" content="light dark">
  <title>The High Press | Touchline Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <article class="story-card" aria-labelledby="story-title">
      <div class="story-card__topbar">
        <a class="brand" href="#story-title" aria-label="Touchline Journal home">
          <span class="brand__mark" aria-hidden="true">TJ</span>
          <span>Touchline Journal</span>
        </a>

        <button class="theme-toggle" id="theme-toggle" type="button" aria-pressed="false">
          <span class="theme-toggle__icon" aria-hidden="true">◐</span>
          <span class="theme-toggle__label">Dark mode</span>
        </button>
      </div>

      <figure class="story-card__media">
        <img
          class="story-card__image"
          src="https://images.unsplash.com/photo-1579952363873-27f3bade9f55?q=85&amp;w=1400&amp;auto=format&amp;fit=crop"
          alt="A soccer ball on a green field under stadium lights"
          width="1400"
          height="933"
          decoding="async"
        >
        <figcaption class="story-card__image-label">Training ground study · pressing structure</figcaption>
      </figure>

      <div class="story-card__body">
        <div class="story-card__meta">
          <span class="badge">Tactical analysis</span>
          <span class="meta-note">11 min read</span>
        </div>

        <h1 class="story-card__title" id="story-title">
          Why the high press changed modern football
        </h1>

        <p class="story-card__description">
          The best pressing teams do more than run hard. They control space, recognize triggers, close passing lanes, and move as one compact unit.
        </p>

        <div class="story-card__actions">
          <a
            class="read-link"
            href="https://learning.coachesvoice.com/cv/in-focus-high-press/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>Read the full analysis</span>
            <span aria-hidden="true">↗</span>
          </a>

          <p class="story-card__credit">Curated from Coaches’ Voice</p>
        </div>
      </div>
    </article>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.querySelector('#theme-toggle');
    const label = toggle.querySelector('.theme-toggle__label');
    const storedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    function applyTheme(theme) {
      const isDark = theme === 'dark';
      root.dataset.theme = theme;
      toggle.setAttribute('aria-pressed', String(isDark));
      label.textContent = isDark ? 'Light mode' : 'Dark mode';
    }

    applyTheme(storedTheme ?? (prefersDark ? 'dark' : 'light'));

    toggle.addEventListener('click', () => {
      const nextTheme = root.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
      localStorage.setItem('theme', nextTheme);
    });
  </script>
</body>
</html>
